<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: "Noi Grotesk", system-ui, sans-serif;
      background: #FFFFFF;
      color: #121212;
    }
    .hsp-popup-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      line-height: 24px;
      letter-spacing: -0.15px;
      margin: 0 0 16px 0;
      color: #121212;
    }
    .hsp-popup-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex: 0 0 auto;
      display: block;
    }
    .hsp-popup-well {
      padding: 12px;
      border: 1px solid rgba(31, 32, 44, 0.2);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .hsp-popup-well:last-child {
      margin-bottom: 0;
    }
    .hsp-popup-label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      line-height: 18px;
      margin-bottom: 8px;
      color: #121212;
    }
    .hsp-popup-input {
      width: 100%;
      padding: 0 12px;
      height: 40px;
      font-family: "Noi Grotesk", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 18px;
      color: #121212;
      background: transparent;
      border: 1px solid rgba(31, 32, 44, 0.2);
      border-radius: 8px;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    .hsp-popup-input:focus {
      outline: none;
      border-color: #1569E0;
      box-shadow: 0 0 0 2px rgba(21, 105, 224, 0.1);
    }
    .hsp-popup-input::placeholder {
      color: rgba(18, 18, 18, 0.4);
    }
    .hsp-popup-btn {
      display: block;
      width: 100%;
      padding: 0 8px;
      height: 36px;
      background: #FFFFFF;
      color: #121212;
      border: 1px solid rgba(31, 32, 44, 0.2);
      border-radius: 8px;
      font-family: "Noi Grotesk", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 18px;
      cursor: pointer;
      text-align: center;
      transition: background-color 150ms ease-out;
    }
    .hsp-popup-btn:hover {
      background: #F6F6F6;
    }
    .hsp-popup-callout {
      padding: 12px;
      background: #B1F8FF;
      color: #000000;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 400;
      line-height: 18px;
      text-align: center;
    }
    .hsp-popup-divider {
      border: none;
      border-top: 1px solid rgba(31, 32, 44, 0.2);
      margin: 12px 0;
    }
    .hsp-popup-footer {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(18, 18, 18, 0.7);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hsp-popup-title">
    <img src="icons/icon-32.png" alt="" class="hsp-popup-logo">
    <span>Handshake Plus</span>
  </div>

  <div id="university-selector" style="display: none;">
    <div class="hsp-popup-well">
      <label for="university-input" class="hsp-popup-label">Select your school to open Handshake:</label>
      <input type="text" id="university-input" list="university-list" placeholder="e.g. Cornell University" class="hsp-popup-input">
      <datalist id="university-list"></datalist>
      <button id="go-to-handshake-btn" class="hsp-popup-btn" style="margin-top: 12px;">Take me to Handshake Jobs</button>
    </div>
  </div>

  <div id="on-handshake-callout" class="hsp-popup-callout" style="display: none;">
    ✓ You're on Handshake. The extension panel is active on this page.
  </div>

  <hr class="hsp-popup-divider">
  <div class="hsp-popup-footer">v1</div>

  <script src="universities.js"></script>
  <script src="popup.js"></script>
</body>

</html>
