                      - paragraph [ref=e750]: San Mateo, CA
                  - paragraph [ref=e751]: "Nextlabs, Inc. is the leading provider of policy-driven information risk management (IRM) software for large enterprises. Nextlabs is privately held and headquartered in San Mateo, California, with offices in London, Paris, Hangzhou, PRC, Singapore, and Malaysia. The Company's flagship data protection and entitlement management products, combine with the Control Center XACML-based policy management platform with integrated content-aware and identity-driven enforcement technology, to offer the most comprehensive information risk management (IRM) solution. Nextlabs products preserve confidentiality, prevent data loss, and ensure compliance across more channels and more points, within a single unified solution with the unmatched user acceptance and Total Cost of Ownership (TCO). Both Nextlabs Entitlement Management and Nextlabs Data Protection are built on top of Nextlabs' industry-leading Control Center policy server platform based on patented technology and the XACML standard. The Nextlabs policy server platform allows customers to easily configure and centrally manage policy that can be applied to applications and data throughout the enterprise. Nextlabs' policy server platform breaks new ground in ease of use, by providing industries first point-and-click rapid application development (RAD) tool for policy and the fourth generation polcy language- ACPL. The unique distributed architecture allows the platform to scale in order to meet enterprise requirements by addressing applications and data on servers, endpoints and mobile devices across platforms with full offline support and zero impact on application performance. The unmatched ease of use and scalability of the Nextlabs policy server platform allows users to configure company policy that can be applied to applications and data on 100,000's of hosts in hours instead of months. Nextlabs' partnerships with industry leaders, such as IBM, SAP, Microsoft, HCL Axon, Adobe, HP, PTC, and Siemens, bring to market industry-focused information risk management (IRM) solutions that combine industry best practices with turnkey applications, to meet customers' governance, risk, and compliance requirements. Nextlabs maintains a growing portfolio of over seventy - five approved and pending patents covering four core areas: fine-grainted and contextual access control, user and workflow remediation, real-time policy enforcement, and the implementation and deployment of extensible and universal authorization services. Nextlabs was founded by Keng Lim, a proven entrepreneur who has played a pivotal role over the last 20 years in the creation of such well-known Internet and software companies as Approach Software, Kiva Software, Netscape, Escalate, and Sygate Technologies."
